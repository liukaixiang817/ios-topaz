name: xnu

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: Hardware patch profile (polaris is RAM-root bring-up only)
        type: choice
        options: [topaz, polaris]
        default: topaz
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main, codex/polaris-preflight]
    paths:
      - "xnu/patches/**"
      - "xnu/profiles/**"
      - "tools/stage-kernel-patches.py"
      - "tools/xnu-iig-cache.py"
      - ".github/workflows/xnu.yml"


concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  # The first qualifying push registers this workflow in a newly created fork.
  TARGET_PLATFORM: ${{ inputs.target_platform || (github.ref == 'refs/heads/codex/polaris-preflight' && 'polaris') || 'topaz' }}
  # ccache: xnu is ~2000 compiles; a patch usually changes a few of them
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
  CCACHE_MAXSIZE: 3G
  CCACHE_WRAP: ${{ github.workspace }}/ccache-bin

jobs:
  build:
    # Explicit macOS27/Xcode27 host. Reuse source-bound DriverKit286 outputs
    # for8796; current iig generates an incompatible IORPC.kernelContent ABI.
    runs-on: ${{ (inputs.target_platform || (github.ref == 'refs/heads/codex/polaris-preflight' && 'polaris') || 'topaz') == 'polaris' && 'xcode-27' || 'macos-14' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Locate compatible interface cache
        if: env.TARGET_PLATFORM == 'polaris'
        id: iig-cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=xnu-iig-compat-v1&per_page=100" --jq '.artifacts | map(select(.expired == false)) | first | .workflow_run.id // empty')
          case "$run_id" in *[!0-9]*) exit 1;; esac
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download retained compatible interface cache
        if: env.TARGET_PLATFORM == 'polaris' && steps.iig-cache.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: xnu-iig-compat-v1
          run-id: ${{ steps.iig-cache.outputs.run_id }}
          github-token: ${{ github.token }}
          path: iig-compat

      - name: Download pinned bootstrap interface sources
        if: env.TARGET_PLATFORM == 'polaris' && steps.iig-cache.outputs.run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: xnu-buildtree
          run-id: 40210874806
          github-token: ${{ github.token }}
          path: iig-bootstrap

      - name: Verify compatible interface sources
        if: env.TARGET_PLATFORM == 'polaris'
        run: |
          if [ -d iig-bootstrap ]; then
            python3 tools/xnu-iig-cache.py prepare --archive iig-bootstrap/buildtree.tgz --output iig-compat
          fi
          python3 tools/xnu-iig-cache.py verify --cache iig-compat

      - uses: actions/upload-artifact@v4
        if: env.TARGET_PLATFORM == 'polaris'
        with:
          name: xnu-iig-compat-v1
          path: iig-compat/
          retention-days: 90

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          python3 tools/stage-kernel-patches.py --platform "$TARGET_PLATFORM" --destination dxb/patches
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64.
          # topaz: Cortex-A53/A73 (ARMv8.0), so the same -mcpu as the kernel
          # (clang's apple-m1 default emits LSE atomics and LDAPR)
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"/' dxb/build.sh
          grep -c 'OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"' dxb/build.sh
          # xnu's makedefs take CC/CXX from the environment dxb exports; xcodebuild
          # (mig, ctf tools) needs a single executable, so point at wrappers
          sed -i '' 's|export CC="$(xcrun -find clang)"|export CC="$CCACHE_WRAP/clang"|; s|export CXX="$(xcrun -find clang++)"|export CXX="$CCACHE_WRAP/clang++"|' dxb/build.sh
          grep -c 'export CC="$CCACHE_WRAP/clang"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          # The selected hosted image already has Xcode; prevent an installer
          # fallback from downloading another toolchain merely for this check.
          if ! command -v xcodes >/dev/null; then
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
            sudo chmod +x /usr/local/bin/xcodes
          fi
          sw_vers
          ls -d /Applications/Xcode*.app
          if [ "$TARGET_PLATFORM" = polaris ]; then
            XC=$(ls -d /Applications/Xcode_27*.app | sort -V | head -1)
          else
            XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          fi
          test -n "$XC"
          export DEVELOPER_DIR="$XC/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          if [ "$TARGET_PLATFORM" = polaris ]; then xcodebuild -version | head -1 | grep '^Xcode 27\.'; fi
          xcrun --find iig
          mkdir -p "$CCACHE_WRAP"
          for t in clang clang++; do
            printf '#!/bin/sh\nexec ccache %s "$@"\n' "$(xcrun -find $t)" > "$CCACHE_WRAP/$t"
            chmod +x "$CCACHE_WRAP/$t"
          done
          if [ "$TARGET_PLATFORM" = polaris ]; then
            printf '#!/bin/sh\nexec python3 "%s/tools/xnu-iig-cache.py" replay "%s/iig-compat" "$@"\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" > "$CCACHE_WRAP/iig"
            chmod +x "$CCACHE_WRAP/iig"
            echo "IIG=$CCACHE_WRAP/iig" >> "$GITHUB_ENV"
          fi
          cat "$CCACHE_WRAP/clang"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ env.TARGET_PLATFORM }}-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-${{ hashFiles('xnu/patches/**', 'xnu/profiles/**', '.github/workflows/xnu.yml') }}
          restore-keys: |
            ccache-${{ env.TARGET_PLATFORM }}-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          ccache -z
          bash build.sh
          ccache -s

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          if [ -d "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" ]; then
            cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/
          fi
          paths=(xnu)
          for path in build/xnu.obj fakeroot/usr/local/include; do
            if [ -e "dxb/$path" ]; then paths+=("$path"); fi
          done
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb "${paths[@]}" \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          printf 'target_platform=%s\nmachine_config=%s\ncommit=%s\n' "$TARGET_PLATFORM" "$MACHINE_CONFIG" "$GITHUB_SHA" > out/build-profile.txt
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
